<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>おうち家事管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#FAFAFA;--tx:#1A1A1A;--t2:#999;--bd:#E0E0E0;
    --a:#C93A2B;--ab:rgba(201,58,43,.06);
    --b:#2663A8;--bb:rgba(38,99,168,.06);
    --f:'Noto Sans JP','Hiragino Sans',system-ui,sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#111114;--tx:#ECECEC;--t2:#666;--bd:#2A2A2D;
      --a:#E85847;--ab:rgba(232,88,71,.08);
      --b:#4A8FD4;--bb:rgba(74,143,212,.08);
    }
  }

  *{box-sizing:border-box}
  body{font-family:var(--f);background:var(--bg);color:var(--tx);
    max-width:480px;margin:0 auto;padding:32px 20px 72px;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

  .hdr{margin-bottom:20px}
  .hdr h1{font-size:1.4rem;font-weight:900;letter-spacing:-.02em;line-height:1.2;margin-bottom:4px}
  .nav{display:flex;align-items:center;gap:10px}
  .nav-btn{font-size:.9rem;color:var(--t2);cursor:pointer;padding:4px 2px;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
    transition:color .12s;line-height:1}
  .nav-btn:active{color:var(--tx)}
  .nav-btn.off{visibility:hidden;pointer-events:none}
  .date{font-size:.78rem;font-weight:300;color:var(--t2);letter-spacing:.02em}
  .past-badge{display:inline-block;font-size:.58rem;font-weight:700;
    padding:2px 6px;background:var(--tx);color:var(--bg);margin-left:8px;letter-spacing:.04em;vertical-align:middle}

  .who{display:flex;margin-bottom:16px}
  .who-btn{flex:1;display:flex;align-items:center;justify-content:space-between;
    font-family:var(--f);font-size:.92rem;font-weight:700;padding:14px 16px;
    border:2px solid var(--bd);background:transparent;color:var(--t2);
    cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none}
  .who-btn+.who-btn{border-left:none}
  .who-n{font-size:.88rem;font-weight:900}
  .who-btn.wa.on{border-color:var(--a);background:var(--a);color:#fff}
  .who-btn.wb.on{border-color:var(--b);background:var(--b);color:#fff}
  .who-btn:not(.on):active{transform:scale(.98)}

  .prog{display:flex;align-items:center;gap:4px;justify-content:center;margin-bottom:20px}
  .sq{width:16px;height:16px;border:1.5px solid var(--bd);transition:background .2s,border-color .2s}
  .sq.sa{background:var(--a);border-color:var(--a)}
  .sq.sb{background:var(--b);border-color:var(--b)}
  .prog-n{font-size:.78rem;font-weight:700;color:var(--t2);margin-left:8px}

  .tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:24px}
  .tab{flex:1;font-family:var(--f);font-size:.8rem;font-weight:400;color:var(--t2);
    background:none;border:none;border-bottom:2px solid transparent;
    padding:8px 0;margin-bottom:-1px;cursor:pointer;transition:all .12s;letter-spacing:.04em}
  .tab.on{color:var(--tx);font-weight:700;border-bottom-color:var(--tx)}

  .sec{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--t2);
    margin-bottom:12px;margin-top:24px;display:flex;align-items:center;gap:8px}
  .sec:first-child{margin-top:0}
  .sec::after{content:'';flex:1;height:1px;background:var(--bd)}

  .tr{display:flex;align-items:center;padding:11px 0;padding-left:12px;border-bottom:1px solid var(--bd);
    border-left:3px solid transparent;
    cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .tr.pa{border-left-color:var(--a)}
  .tr.pb{border-left-color:var(--b)}
  .tr:active{opacity:.7}
  .past .tr,.tr.ro{cursor:default;opacity:.5}
  .past .tr:active,.tr.ro:active{opacity:.5}
  .tr-info{flex:1;min-width:0}
  .tr-n{font-size:.82rem;font-weight:700;display:block;line-height:1.3}
  .tr-f{font-size:.62rem;font-weight:700;padding:2px 8px;letter-spacing:.04em;
    margin-left:6px;display:inline-block;vertical-align:middle}
  .tr.daily .tr-f{color:#fff;background:#E67E22}
  .tr:not(.daily) .tr-f{color:var(--tx);background:var(--bd)}
  .tr-dots{display:flex;gap:3px;align-items:center;margin-right:8px;flex-shrink:0}
  .dot{width:7px;height:7px;border:1.5px solid var(--bd);flex-shrink:0;transition:all .15s}
  .dot.da{background:var(--a);border-color:var(--a)}
  .dot.db{background:var(--b);border-color:var(--b)}
  .tr-c{font-size:.82rem;font-weight:900;min-width:28px;text-align:right;flex-shrink:0}
  .tr-c .tgt{font-size:.68rem;font-weight:400;color:var(--t2)}
  .tr-dec{display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;margin-left:6px;border:1.5px solid var(--bd);
    font-size:.82rem;font-weight:700;color:var(--t2);background:transparent;
    cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
    font-family:var(--f);flex-shrink:0;vertical-align:middle}
  .tr-dec:active{background:var(--bd)}
  .tr-dec.dim{opacity:.25;pointer-events:none}
  .tr.done .tr-n{color:var(--t2)}

  .rpt-hero{text-align:center;margin-bottom:24px}
  .rpt-big{font-size:3.5rem;font-weight:900;line-height:1}
  .rpt-of{font-size:1rem;font-weight:300;color:var(--t2)}
  .rpt-stats{display:flex;gap:12px;margin-bottom:28px}
  .rpt-st{flex:1;padding:16px;border-top:3px solid}
  .rpt-st.sa{border-color:var(--a);background:var(--ab)}
  .rpt-st.sb{border-color:var(--b);background:var(--bb)}
  .rpt-st-n{font-size:.72rem;font-weight:700;margin-bottom:6px}
  .rpt-st.sa .rpt-st-n{color:var(--a)} .rpt-st.sb .rpt-st-n{color:var(--b)}
  .rpt-st-num{font-size:2rem;font-weight:900;line-height:1}

  .rpt-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
  .rpt-row-n{flex:1;font-size:.82rem;font-weight:700}
  .rpt-row-s{font-size:.7rem;font-weight:700;padding:3px 8px}
  .rpt-ok{background:var(--a);color:#fff}
  .rpt-ok.b{background:var(--b)}
  .rpt-ng{color:var(--t2);font-weight:400;font-style:italic}

  .ft{text-align:center;margin-top:32px;font-size:.62rem;color:var(--t2);font-weight:300;letter-spacing:.03em;line-height:1.6}
  .sync{display:inline-block;margin-top:6px;font-size:.58rem;padding:2px 8px;letter-spacing:.06em}
  .sync.on{background:var(--tx);color:var(--bg)}

  .rule{margin-bottom:14px}
  .rule-n{font-size:.82rem;font-weight:700;margin-bottom:2px}
  .rule-body{font-size:.75rem;color:var(--t2);line-height:1.6}
  .rule-em{font-size:.88rem;font-weight:900;text-align:center;padding:16px 0;margin-bottom:8px}
</style>
</head>
<body>

<div id="app">
  <div class="hdr">
    <h1>おうち家事管理</h1>
    <div class="nav">
      <span class="nav-btn" id="navL">◀</span>
      <span class="date" id="date"></span>
      <span class="nav-btn off" id="navR">▶</span>
    </div>
  </div>
  <div id="who"></div>
  <div id="prog"></div>
  <div class="tabs">
    <button class="tab on" id="t1">タスク</button>
    <button class="tab" id="t2">レポート</button>
    <button class="tab" id="t3">ルール</button>
  </div>
  <div id="v1"></div>
  <div id="v2" hidden></div>
  <div id="v3" hidden></div>
  <div class="ft">名前を選んでタスクをタップ ・ 毎週月曜リセット<br><span class="sync" id="sync"></span></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCm8YFbCkmAm1wKZTjloZTfvDqRYw79U1I",
  authDomain:"souji-rota.firebaseapp.com",
  databaseURL:"https://souji-rota-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"souji-rota",
  storageBucket:"souji-rota.firebasestorage.app",
  messagingSenderId:"775580575167",
  appId:"1:775580575167:web:f0732ba4802860fc2dad0a"
});
var fbDb=firebase.database();

var T=[
  {id:'cook',n:'食事（料理・準備）',p:'a',t:7,f:'毎日'},
  {id:'dish',n:'シンク・キッチン（食器洗い・片付け）',p:'a',t:7,f:'毎日'},
  {id:'entrance',n:'玄関（掃除・靴の整理）',p:'a',t:7,f:'毎日'},
  {id:'bath_a',n:'浴室（掃除）',p:'a',t:7,f:'毎日'},
  {id:'living',n:'リビング・ダイニング（片付け・整理）',p:'b',t:7,f:'毎日'},
  {id:'sweep',n:'リビング・ダイニング・廊下（掃除機・クイックルワイパー）',p:'b',t:3,f:'週3'},
  {id:'toilet',n:'トイレ（掃除）',p:'b',t:1,f:'週1'},
  {id:'bath',n:'浴室（排水口掃除）',p:'b',t:7,f:'毎日'},
  {id:'washroom',n:'洗面所（掃除機・クイックルワイパー）',p:'b',t:7,f:'毎日'},
  {id:'washroom_w',n:'洗面台（拭き掃除）',p:'b',t:1,f:'週1'},
  {id:'trash',n:'ゴミ箱（分別・ゴミ出し）',p:'b',t:0},
  {id:'laundry',n:'衣類（洗濯・干す・畳む）',p:'b',t:4,f:'2日に1回'},
  {id:'sheets',n:'シーツ・寝具（交換・洗濯）',p:'b',t:1,f:'週1'},
];
var TA=T.filter(function(x){return x.p==='a'});
var TB=T.filter(function(x){return x.p==='b'});
var DN=['日','月','火','水','木','金','土'];
var nm={a:'とうま',b:'まどか'};
var kd={},me='a',tab='tasks',vOff=0,vKd=null;

function curMonday(){var d=new Date(),dy=d.getDay(),m=new Date(d);m.setDate(d.getDate()-(dy===0?6:dy-1));return m}
function wk(){var m=curMonday();return m.getFullYear()+'-'+(m.getMonth()+1)+'-'+m.getDate()}
function viewMonday(){var m=curMonday();m.setDate(m.getDate()+vOff*7);return m}
function viewWk(){var m=viewMonday();return m.getFullYear()+'-'+(m.getMonth()+1)+'-'+m.getDate()}

function dateLabel(){
  var m=viewMonday(),s=new Date(m);s.setDate(m.getDate()+6);
  return(m.getMonth()+1)+'.'+m.getDate()+' '+DN[m.getDay()]+' — '+(s.getMonth()+1)+'.'+s.getDate()+' '+DN[s.getDay()]}

function gc(data,tid,p){return(data[tid]&&data[tid][p])||0}
function tc(data,tid){return gc(data,tid,'a')+gc(data,tid,'b')}
function isDone(data,task){var tot=tc(data,task.id);return task.t>0?tot>=task.t:tot>0}

function svKd(){fbDb.ref('kaji/'+wk()).set(kd)}
function cleanKd(){
  var dirty=false;
  T.forEach(function(t){
    if(!kd[t.id])return;
    var wrong=t.p==='a'?'b':'a';
    if(kd[t.id][wrong]){delete kd[t.id][wrong];dirty=true}
    if(Object.keys(kd[t.id]).length===0){delete kd[t.id];dirty=true}
  });
  if(dirty){svKd();render()}
}
function svMe(){try{localStorage.setItem('souji_me',me)}catch(e){}}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function tappedToday(tid){try{var r=JSON.parse(localStorage.getItem('souji_tap')||'{}');return r[tid]===todayKey()}catch(e){return false}}
function markTap(tid){try{var r=JSON.parse(localStorage.getItem('souji_tap')||'{}');r[tid]=todayKey();localStorage.setItem('souji_tap',JSON.stringify(r))}catch(e){}}
function unmarkTap(tid){try{var r=JSON.parse(localStorage.getItem('souji_tap')||'{}');delete r[tid];localStorage.setItem('souji_tap',JSON.stringify(r))}catch(e){}}
function decToday(tid){try{var r=JSON.parse(localStorage.getItem('souji_dec')||'{}');return r[tid]===todayKey()}catch(e){return false}}
function markDec(tid){try{var r=JSON.parse(localStorage.getItem('souji_dec')||'{}');r[tid]=todayKey();localStorage.setItem('souji_dec',JSON.stringify(r))}catch(e){}}

function navWeek(dir){
  vOff+=dir;if(vOff>0)vOff=0;
  if(vOff<0){
    fbDb.ref('kaji/'+viewWk()).once('value',function(snap){
      vKd=snap.val()||{};render();
    });
  } else {vKd=null;render()}
}

function taskRow(task,data,past){
  var ca=gc(data,task.id,'a'),cb=gc(data,task.id,'b'),tot=ca+cb;
  var done=isDone(data,task);
  var mine=task.p===me;
  var ro=past||!mine;
  var h='<div class="tr p'+task.p+(done?' done':'')+(task.t===7?' daily':'')+(ro?' ro':'')+'"'+(!ro?' data-tid="'+task.id+'"':'')+'>';
  h+='<span class="tr-info"><span class="tr-n">'+task.n+'</span>';
  if(task.f)h+=' <span class="tr-f">'+task.f+'</span>';
  h+='</span>';
  if(task.t>0){
    h+='<span class="tr-dots">';
    for(var i=0;i<task.t;i++){
      if(i<ca)h+='<span class="dot da"></span>';
      else if(i<ca+cb)h+='<span class="dot db"></span>';
      else h+='<span class="dot"></span>';
    }
    h+='</span>';
    h+='<span class="tr-c">'+tot+'<span class="tgt">/'+task.t+'</span></span>';
    if(!ro)h+='<button class="tr-dec'+(tot<1?' dim':'')+'" data-dec="'+task.id+'">−</button>';
  } else {
    h+='<span class="tr-c">'+(tot||'')+'</span>';
    if(!ro)h+='<button class="tr-dec'+(tot<1?' dim':'')+'" data-dec="'+task.id+'">−</button>';
  }
  h+='</div>';
  return h;
}

function render(){
  var past=vOff<0;
  var cD=past?(vKd||{}):kd;

  document.getElementById('date').innerHTML=dateLabel()+(past?'<span class="past-badge">過去</span>':'<span class="past-badge" style="background:var(--a);color:#fff">今週</span>');
  document.getElementById('navR').classList.toggle('off',vOff>=0);

  var aDone=0,bDone=0,aAll=TA.length,bAll=TB.length;
  TA.forEach(function(t){if(isDone(cD,t))aDone++});
  TB.forEach(function(t){if(isDone(cD,t))bDone++});
  var allDone=aDone+bDone;

  var aProg=0,bProg=0;
  TA.forEach(function(t){var tot=tc(cD,t.id);aProg+=t.t>0?Math.min(tot/t.t,1):(tot>0?1:0)});
  TB.forEach(function(t){var tot=tc(cD,t.id);bProg+=t.t>0?Math.min(tot/t.t,1):(tot>0?1:0)});
  var aPct=aAll?Math.round(aProg/aAll*100):0;
  var bPct=bAll?Math.round(bProg/bAll*100):0;
  document.getElementById('who').innerHTML='<div class="who">'+
    '<button class="who-btn wa'+(me==='a'?' on':'')+'" data-me="a"><span>'+nm.a+'</span><span class="who-n">'+aPct+'%</span></button>'+
    '<button class="who-btn wb'+(me==='b'?' on':'')+'" data-me="b"><span>'+nm.b+'</span><span class="who-n">'+bPct+'%</span></button></div>';

  document.getElementById('prog').innerHTML='<div class="prog">'+
    T.map(function(t){return'<div class="sq'+(isDone(cD,t)?(t.p==='a'?' sa':' sb'):'')+'"></div>'}).join('')+
    '<span class="prog-n">'+allDone+'/'+T.length+'</span></div>';

  if(tab==='tasks'){
    var h='<div class="sec" style="color:var(--a)">'+nm.a+'のタスク</div>';
    h+=(past?'<div class="past">':'');
    h+=TA.map(function(t){return taskRow(t,cD,past)}).join('');
    h+='<div class="sec" style="color:var(--b)">'+nm.b+'のタスク</div>';
    h+=TB.map(function(t){return taskRow(t,cD,past)}).join('');
    h+=(past?'</div>':'');
    document.getElementById('v1').innerHTML=h;
    document.getElementById('v1').hidden=false;
    document.getElementById('v2').hidden=true;
    document.getElementById('v3').hidden=true;
  } else if(tab==='report'){
    var r='<div class="rpt-hero"><div class="rpt-big">'+allDone+'</div>'+
      '<div class="rpt-of">/ '+T.length+' タスク達成</div></div>';
    r+='<div class="rpt-stats">'+
      '<div class="rpt-st sa"><div class="rpt-st-n">'+nm.a+'</div><div class="rpt-st-num">'+aPct+'%</div></div>'+
      '<div class="rpt-st sb"><div class="rpt-st-n">'+nm.b+'</div><div class="rpt-st-num">'+bPct+'%</div></div></div>';

    r+='<div class="sec" style="color:var(--a)">'+nm.a+'のタスク</div>';
    r+=TA.map(function(t){
      var tot=tc(cD,t.id),done=isDone(cD,t);
      var label=t.t>0?tot+'/'+t.t:(tot>0?tot+'回':'');
      return'<div class="rpt-row"><span class="rpt-row-n">'+t.n+'</span>'+
        (done?'<span class="rpt-row-s rpt-ok">'+label+'</span>':'<span class="rpt-row-s rpt-ng">'+(label||'未実施')+'</span>')+
        '</div>';
    }).join('');

    r+='<div class="sec" style="color:var(--b)">'+nm.b+'のタスク</div>';
    r+=TB.map(function(t){
      var tot=tc(cD,t.id),done=isDone(cD,t);
      var label=t.t>0?tot+'/'+t.t:(tot>0?tot+'回':'');
      return'<div class="rpt-row"><span class="rpt-row-n">'+t.n+'</span>'+
        (done?'<span class="rpt-row-s rpt-ok b">'+label+'</span>':'<span class="rpt-row-s rpt-ng">'+(label||'未実施')+'</span>')+
        '</div>';
    }).join('');

    document.getElementById('v2').innerHTML=r;
    document.getElementById('v1').hidden=true;
    document.getElementById('v2').hidden=false;
    document.getElementById('v3').hidden=true;
  } else {
    var ru='<div class="rule-em">思いやりと感謝を忘れない！</div>';
    ru+='<div class="rule"><div class="rule-n">透真（夫）の担当</div><div class="rule-body">料理 / 食器洗い・片付け / 玄関・靴</div></div>';
    ru+='<div class="rule"><div class="rule-n">円香（妻）の担当</div><div class="rule-body">リビング・ダイニング片付け / 掃除機・ワイパー / トイレ / お風呂 / 洗面所 / ゴミ出し / 洗濯 / シーツ・寝具</div></div>';
    ru+='<div class="sec">共通ルール<span></span></div>';
    ru+='<div class="rule"><div class="rule-body">1. 最低ラインを満たしていれば「やっていない」としない</div></div>';
    ru+='<div class="rule"><div class="rule-body">2. いつ・どうやるかは担当者に任せる</div></div>';
    ru+='<div class="rule"><div class="rule-body">3. 相手の担当が気になっても、最低ライン内なら任せる</div></div>';
    ru+='<div class="rule"><div class="rule-body">4. 最低ライン以上を求めるなら自分でやる（相手の未達にしない）</div></div>';
    ru+='<div class="rule"><div class="rule-body">5. 相手の私物は勝手に片付けない（一言聞く）</div></div>';
    ru+='<div class="rule"><div class="rule-body">6. まず2週間やってみて調整する</div></div>';
    ru+='<div class="rule"><div class="rule-body">7. 負担が偏ったら作業量・時間・頻度を確認して分担調整</div></div>';
    ru+='<div class="sec">その他<span></span></div>';
    ru+='<div class="rule"><div class="rule-body">水やり — 夫の趣味として扱う（家事分担の対象外）</div></div>';
    document.getElementById('v3').innerHTML=ru;
    document.getElementById('v1').hidden=true;
    document.getElementById('v2').hidden=true;
    document.getElementById('v3').hidden=false;
  }
}

function setTab(t){tab=t;
  document.getElementById('t1').classList.toggle('on',t==='tasks');
  document.getElementById('t2').classList.toggle('on',t==='report');
  document.getElementById('t3').classList.toggle('on',t==='rules');render()}

document.getElementById('t1').addEventListener('click',function(){setTab('tasks')});

document.getElementById('app').addEventListener('click',function(e){
  var wb=e.target.closest('.who-btn');
  if(wb){me=wb.dataset.me;svMe();render();return}

  var dec=e.target.closest('[data-dec]');
  if(dec){
    var did=dec.dataset.dec;
    if(decToday(did))return;
    if(!kd[did])kd[did]={};
    var mc=gc(kd,did,me);
    if(mc>0){kd[did][me]=mc-1;if(kd[did][me]===0)delete kd[did][me];
      if(!kd[did]||Object.keys(kd[did]).length===0)delete kd[did];
      markDec(did);unmarkTap(did);svKd();render();}return}

  var row=e.target.closest('.tr[data-tid]');
  if(!row)return;
  var tid=row.dataset.tid;
  var task=T.find(function(x){return x.id===tid});
  if(!task)return;
  if(task.p!==me)return;
  if(tappedToday(tid))return;
  if(!kd[tid])kd[tid]={};
  var myC=gc(kd,tid,me),tot=tc(kd,tid);

  if(task.t===1){
    if(myC>0){kd[tid][me]=0}else{kd[tid][me]=1}
  } else if(task.t>1){
    kd[tid][me]=myC+1;
  } else {
    kd[tid][me]=myC+1;
  }
  markTap(tid);

  if(kd[tid][me]===0)delete kd[tid][me];
  if(!kd[tid]||Object.keys(kd[tid]).length===0)delete kd[tid];
  svKd();render();
});
